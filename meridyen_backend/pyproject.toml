[project]
name = "meridyen-backend"
version = "1.0.0"
description = "Privacy-first Turkish social AI ranking and creator-economy backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18,<2", "tokenizers>=0.20,<1"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
meridyen-api = "meridyen.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
